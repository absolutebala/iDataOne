<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iDataOne</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(99,102,241,0.18), transparent 35%),
                radial-gradient(circle at bottom right, rgba(59,130,246,0.15), transparent 35%),
                linear-gradient(135deg, #0f172a 0%, #111827 40%, #1e293b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
        }

        /* subtle grid */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 1100px;
            padding: 40px;
        }

        .badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            color: #c7d2fe;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.4px;
            margin-bottom: 32px;
        }

        .logo {
            width: 560px;
            max-width: 92%;
            margin-bottom: 40px;
            animation: float 5s ease-in-out infinite;
            filter:
                drop-shadow(0px 0px 25px rgba(167,139,250,0.25))
                drop-shadow(0px 20px 40px rgba(0,0,0,0.35));
        }

        h1 {
            font-size: 60px;
            line-height: 1.12;
            letter-spacing: -2px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #f8fafc;
        }

        .highlight {
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            max-width: 900px;
            margin: auto;
            font-size: 20px;
            line-height: 1.8;
            color: #cbd5e1;
            font-weight: 400;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {

            body {
                padding: 20px;
            }

            .logo {
                width: 340px;
            }

            h1 {
                font-size: 40px;
                line-height: 1.2;
            }

            p {
                font-size: 17px;
                line-height: 1.7;
            }

            .badge {
                font-size: 13px;
                padding: 9px 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="badge">
            AI-First Digital Intelligence Services
        </div>

        <img 
            src="erasebg-transformed (1).png"
            alt="iDataOne Logo"
            class="logo"
        >

        <h1>
            Engineering <span class="highlight">AI-First Products</span><br>
            and Intelligent Data Platforms
        </h1>

        <p>
            We help businesses build intelligent digital systems powered by unified data, 
            automation, and AI-driven insights.
        </p>

    </div>

</body>
</html>
