<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iDataOne</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(99,102,241,0.10), transparent 30%),
                radial-gradient(circle at bottom right, rgba(59,130,246,0.08), transparent 30%),
                linear-gradient(135deg, #f8fafc 0%, #eef2ff 45%, #f1f5f9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Subtle Grid */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(15,23,42,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15,23,42,0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: radial-gradient(circle at center, black 45%, transparent 90%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 1200px;
            padding: 40px;
        }

        .logo {
            width: 450px;
    max-width: 90%;
            margin-bottom: 45px;
            animation: float 5s ease-in-out infinite;
            filter:
                drop-shadow(0px 15px 40px rgba(99,102,241,0.12))
                drop-shadow(0px 10px 20px rgba(0,0,0,0.06));
        }

        h1 {
            font-size: 58px;
            line-height: 1.12;
            letter-spacing: -2px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #0f172a;
        }

        .highlight {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            max-width: 920px;
            margin: auto;
            font-size: 20px;
            line-height: 1.8;
            color: #475569;
            font-weight: 400;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {

            body {
                padding: 20px;
            }

            .logo {
                width: 100%;
                margin-bottom: 30px;
            }

            h1 {
                font-size: 38px;
                line-height: 1.2;
            }

            p {
                font-size: 17px;
                line-height: 1.7;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img 
            src="iDataOneLogoNoBG.png"
            alt="iDataOne Logo"
            class="logo"
        >

        <h1>
            Engineering <span class="highlight">AI-First Products</span><br>
            and Intelligent Data Platforms
        </h1>

        <p>
            We help businesses build intelligent digital systems powered by unified data, 
            automation, and AI-driven insights.
        </p>

    </div>

</body>
</html>
